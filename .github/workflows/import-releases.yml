name: Import historical releases
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: import-historical-releases
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify and import public release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { mkdtemp, readFile, writeFile, rm } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import path from 'node:path';
          import { createHash } from 'node:crypto';

          const source = 'wells974/nofy-helper', target = 'NofyAI/nofy-helper-releases';
          if (process.env.GITHUB_REPOSITORY !== target) throw new Error('Wrong destination repository');
          const gh = args => execFileSync('gh', args, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'], maxBuffer: 4 * 1024 * 1024 });
          const api = route => JSON.parse(gh(['api', route]));
          const destination = api(`repos/${target}`);
          if (destination.private || destination.fork) throw new Error('Destination must be an independent public repository');
          const commit = api(`repos/${target}/commits/${encodeURIComponent(destination.default_branch)}`).sha;
          if (!/^[a-f0-9]{40}$/.test(commit)) throw new Error('Invalid public repository commit');

          for (const version of ['0.1.2', '0.1.3', '0.1.4']) {
            const tag = `v${version}`, original = api(`repos/${source}/releases/tags/${tag}`);
            if (original.draft || original.prerelease || original.tag_name !== tag) throw new Error('Source is not a stable published release');
            const packages = [
              `nofy-helper-${version}-x64-setup.exe`,
              ...['x64', 'arm64'].flatMap(arch => ['dmg', 'zip'].map(ext => `nofy-helper-${version}-mac-${arch}.${ext}`)),
              `nofy-helper-${version}-linux-x86_64.AppImage`, `nofy-helper-${version}-linux-x64.tar.gz`,
            ];
            const names = [...packages, 'SHA256SUMS.txt'].sort();
            if (JSON.stringify(original.assets.map(a => a.name).sort()) !== JSON.stringify(names)) throw new Error(`Unexpected source assets: ${tag}`);
            const folder = await mkdtemp(path.join(tmpdir(), 'nofy-release-import-'));
            try {
              gh(['release', 'download', tag, '--repo', source, '--dir', folder]);
              const hashes = new Map();
              for (const name of names) {
                const bytes = await readFile(path.join(folder, name));
                const hash = createHash('sha256').update(bytes).digest('hex');
                const originalAsset = original.assets.find(a => a.name === name);
                if (bytes.length !== originalAsset.size || (originalAsset.digest && originalAsset.digest !== `sha256:${hash}`)) throw new Error(`Source asset verification failed: ${name}`);
                hashes.set(name, { hash, size: bytes.length });
              }
              const lines = (await readFile(path.join(folder, 'SHA256SUMS.txt'), 'utf8')).trim().split(/\r?\n/);
              const checked = new Set();
              for (const line of lines) {
                const match = /^([a-f0-9]{64})  ([A-Za-z0-9_.-]+)$/.exec(line);
                if (!match || !packages.includes(match[2]) || checked.has(match[2]) || hashes.get(match[2]).hash !== match[1]) throw new Error(`Invalid source checksum file: ${tag}`);
                checked.add(match[2]);
              }
              if (checked.size !== packages.length) throw new Error(`Incomplete source checksums: ${tag}`);

              const existing = api(`repos/${target}/releases?per_page=100`).find(r => r.tag_name === tag);
              const verify = release => {
                if (JSON.stringify(release.assets.map(a => a.name).sort()) !== JSON.stringify(names)) throw new Error(`Destination asset set differs: ${tag}`);
                for (const asset of release.assets) {
                  const expected = hashes.get(asset.name);
                  if (asset.size !== expected.size || asset.digest !== `sha256:${expected.hash}`) throw new Error(`Destination checksum differs: ${asset.name}`);
                }
              };
              if (existing && !existing.draft) { verify(existing); console.log(`${tag}: already published and verified`); continue; }
              const notesFile = path.join(folder, 'notes.md');
              await writeFile(notesFile, original.body || 'nofy-helper historical release');
              if (!existing) gh(['release', 'create', tag, '--repo', target, '--target', commit, '--draft', '--title', original.name || tag, '--notes-file', notesFile]);
              gh(['release', 'upload', tag, '--repo', target, '--clobber', ...names.map(name => path.join(folder, name))]);
              verify(api(`repos/${target}/releases/tags/${tag}`));
              gh(['release', 'edit', tag, '--repo', target, '--draft=false', `--latest=${version === '0.1.4'}`]);
              console.log(`${tag}: all 8 assets verified and published`);
            } finally { await rm(folder, { recursive: true, force: true }); }
          }

          NODE
